name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            templates/
            blueprints/
            bundles.json
            blueprints_bundles.json
            scripts/
            packages/
            nx.json
            package.json
            package-lock.json
            pyproject.toml
            tsconfig.base.json
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip build pytest ruff aiohttp twine

      # Must run BEFORE the sync below. sync_bundles.py rewrites manifest.json
      # from whatever is on disk, so anything that validates after it can only
      # ever see a freshly generated manifest — never the committed one. That
      # ordering is how the stale hashes in
      # https://github.com/Comfy-Org/workflow_templates/issues/1091 reached main.
      - name: Verify committed manifest is not stale
        run: |
          echo "🔍 Validating packages/core/.../manifest.json as committed (pre-sync)."
          if ! python scripts/validate/validate_manifests.py; then
            echo "::error file=packages/core/src/comfyui_workflow_templates_core/manifest.json::Manifest is out of sync with templates/. Run 'python scripts/sync/sync_bundles.py' and commit the regenerated manifest."
            exit 1
          fi

      - name: Sync manifest and bundle assets
        run: |
          source .venv/bin/activate
          python scripts/sync/sync_bundles.py

      - name: Lint Python modules
        run: |
          source .venv/bin/activate
          ruff check scripts/sync/sync_bundles.py scripts/sync/fetch_algolia_usage.py scripts/sync/sync_is_app.py scripts/lib/index_format.py packages/core packages/meta

      - name: Build packages
        run: |
          source .venv/bin/activate
          rm -rf dist
          mkdir dist
          for pkg in core json media_api media_video media_image media_other media_assets_01 meta; do
            python -m build --outdir dist packages/$pkg
          done

      - name: Run Nx build (sanity)
        env:
          NX_ADD_PLUGINS: "false"
          NX_DAEMON: "false"
        run: |
          source .venv/bin/activate
          npm run build:all

      - name: Run tests
        env:
          PYTHONPATH: packages/meta/src:packages/core/src:packages/json/src:packages/media_api/src:packages/media_video/src:packages/media_image/src:packages/media_other/src:packages/media_assets_01/src
        run: |
          source .venv/bin/activate
          pytest packages/core/tests
