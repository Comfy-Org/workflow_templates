name: Link Checker (Site)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/link-checker-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/link-checker-site.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  link-checker:
    name: Internal Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/site-setup

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      # This check runs against `astro dev` rather than a full `astro build`
      # + `astro preview` (see playwright.links.config.ts) — dev mode serves
      # SSR routes (creator profiles) directly from source, so it only needs
      # local template metadata synced, not the full AI-content/prerender
      # pipeline.
      - name: Sync template metadata
        run: pnpm run sync:en-only

      - name: Run internal link checks
        id: links
        continue-on-error: true
        run: pnpm run test:links

      - name: Upload test artifacts
        if: steps.links.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: link-checker-results
          path: |
            site/test-results/
            site/playwright-report/
          retention-days: 14

      - name: Build comment body
        if: always() && github.event_name == 'pull_request'
        id: comment
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const outcome = '${{ steps.links.outcome }}';
            const passed = outcome === 'success';

            const lines = ['<!-- site-link-checker-results -->', '## 🔗 Internal Link Check', ''];

            if (passed) {
              lines.push(
                '✅ Nav-generated and hub-page internal links all resolve to real routes.'
              );
            } else {
              lines.push(
                '❌ Found an internal link pointing at a route the site does not serve.',
                '',
                '📦 Download the **link-checker-results** artifact for the full Playwright report.',
                '',
                'To reproduce locally:',
                '```bash',
                'cd site',
                'pnpm run sync:en-only',
                'pnpm run test:links',
                '```',
              );
            }

            lines.push('', '---', '*Generated by Link Checker workflow*');
            return lines.join('\n');

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && steps.comment.outputs.result
        uses: ./.github/actions/upsert-pr-comment
        with:
          marker: '<!-- site-link-checker-results -->'
          body: ${{ steps.comment.outputs.result }}

      - name: Fail if link checks failed
        if: steps.links.outcome == 'failure'
        run: exit 1
