# Health gate for the MiniMax H3 in-browser demo (FE-1932).
#
# Runs the end-to-end integration test against production and, when it fails,
# switches the `minimaxH3Demo` experiment flag off and says so in Slack.
#
# It deliberately does NOT fail. The demo is served by the Comfy dev platform
# (private beta) through comfy-router (pre-alpha); both are expected to have
# downtime, and a red check on a pre-alpha dependency must never hold up an
# unrelated template release. "Blocking the deploy" is achieved by shipping the
# feature switched off rather than by blocking the pipeline: the next site build
# picks up the committed flag and serves the static fallback instead of a runner
# nobody can run.
#
# Recovery is deliberately NOT automatic. A green run only reports that the demo
# could be switched back on — turning an experiment back on in front of users is
# a judgement call about whether it is worth showing, not something a passing
# health check should decide on its own.
#
# Requires, in this repo's settings:
#   secrets.SLACK_BOT_TOKEN               — same bot used by ComfyUI_frontend
#   vars.SLACK_HUB_ALERTS_CHANNEL_ID      — channel for these alerts
# Both are optional at runtime: the notify step warns and skips if either is
# unset, so the flag flip still happens.
name: MiniMax Demo Integration

on:
  schedule:
    # Every 6 hours. Frequent enough to catch an outage within one working
    # session, rare enough that the demo's single deployment is not tied up.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin to test (defaults to https://comfy.org)'
        type: string
        default: 'https://comfy.org'
  workflow_run:
    # Verify right after the site actually ships, which is the moment a routing
    # or config regression becomes visible to users.
    workflows: ['Deploy Template Site', 'Cron Rebuild Site']
    types: [completed]
    branches: [main]

# One run at a time: two concurrent runs would race on the flag file and could
# put two GPU jobs on a single-deployment demo.
concurrency:
  group: minimax-demo-integration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Skip when the triggering deploy itself failed — the demo being unreachable
    # is then a symptom of that failure, not a reason to switch the demo off.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup
        uses: ./.github/actions/site-setup

      - name: Read current flag state
        id: flag
        working-directory: site
        run: |
          enabled=$(jq -r '.minimaxH3Demo.enabled' src/data/experiment-flags.json)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "Demo flag is currently: $enabled"

      - name: Run integration test
        id: test
        continue-on-error: true
        working-directory: site
        env:
          DEMO_BASE_URL: ${{ inputs.base_url || 'https://comfy.org' }}
          # Plain output so the reason can be parsed out below without ANSI codes.
          NO_COLOR: '1'
        run: |
          # pipefail: without it `tee` supplies the exit status and every run
          # would look green, which is the one bug that would make this whole
          # workflow silently useless.
          set -o pipefail
          pnpm run test:integration 2>&1 | tee "$RUNNER_TEMP/integration.log"

      - name: Summarize
        id: summary
        env:
          OUTCOME: ${{ steps.test.outcome }}
          BASE_URL: ${{ inputs.base_url || 'https://comfy.org' }}
          WAS_ENABLED: ${{ steps.flag.outputs.enabled }}
        run: |
          {
            echo "## MiniMax H3 demo integration"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Target** | $BASE_URL |"
            echo "| **Result** | $([ "$OUTCOME" = success ] && echo '✅ passing' || echo '❌ failing') |"
            echo "| **Flag before this run** | $WAS_ENABLED |"
          } >> "$GITHUB_STEP_SUMMARY"

          # First error line names the actual cause (router 404 vs CSRF 403 vs
          # backend 502) rather than just "a test failed". This string is posted
          # to Slack AND committed into experiment-flags.json as the flag's
          # permanent reason, so it has to be right.
          #
          # TypeError is matched, not just AssertionError: a down origin fails
          # as `TypeError: fetch failed` before any assertion runs — the single
          # most likely outage, given the backend is private beta. Matching only
          # assertions would skip past it to a downstream guard and record
          # "nothing to poll", which reads like a diagnosis and is not one.
          reason=$(grep -m1 -oP '^\s*(?:AssertionError|TypeError|ReferenceError|SyntaxError|Error):.*' \
            "$RUNNER_TEMP/integration.log" | tr -d '\r\n' | cut -c1-300 || true)
          [ -n "$reason" ] || reason="See the workflow run for details."
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Switch the demo off
        id: disable
        # Three conditions, all required:
        #   - the test failed
        #   - the demo is currently on (a failing test against an already-off
        #     demo is expected, and must not commit or re-alert every 6 hours)
        #   - production was what we tested. A dispatch against a preview origin
        #     is for debugging; it must never flip the flag users are served.
        if: >-
          steps.test.outcome == 'failure'
          && steps.flag.outputs.enabled == 'true'
          && (inputs.base_url || 'https://comfy.org') == 'https://comfy.org'
        # The kill switch must not take the job down with it: if this step
        # fails, the steps below still run and Slack still says the demo is
        # stuck on. Without this, the alert is silent exactly when it matters.
        continue-on-error: true
        working-directory: site
        env:
          # Via the environment, never string-interpolated into the command:
          # this text embeds an origin server's response body.
          REASON: ${{ steps.summary.outputs.reason }}
          BASE_URL: ${{ inputs.base_url || 'https://comfy.org' }}
        run: |
          pnpm run experiment-flag minimaxH3Demo off \
            --by "ci:minimax-demo-integration" \
            --reason "Integration test failed against ${BASE_URL}: ${REASON}"

      - name: Commit the flag flip
        id: commit
        if: steps.disable.outputs.changed == 'true'
        continue-on-error: true
        env:
          REASON: ${{ steps.summary.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/experiment-flags.json
          printf '%s\n\n%s\n\nRun: %s\n' \
            'chore(site): switch the MiniMax H3 demo off after a failed integration check' \
            "$REASON" "$RUN_URL" > "$RUNNER_TEMP/commit-msg.txt"
          git commit --file="$RUNNER_TEMP/commit-msg.txt"
          git push origin HEAD:main

      - name: Notify Slack
        # Three reasons to speak, and nothing else:
        #   - we just switched the demo off
        #   - we tried to and could not, so it is stuck on and broken
        #   - somebody ran this by hand and is waiting for the answer
        #
        # Recovery is NOT announced on schedule/deploy runs. This workflow keeps
        # no state between runs, and "healthy while switched off" is the shipped
        # steady state — alerting on it would post the same message 4x a day
        # forever. Scheduled recovery shows up in the step summary instead.
        if: >-
          steps.disable.outputs.changed == 'true'
          || steps.disable.outcome == 'failure'
          || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_HUB_ALERTS_CHANNEL_ID }}
          DISABLED: ${{ steps.disable.outputs.changed }}
          DISABLE_OUTCOME: ${{ steps.disable.outcome }}
          COMMITTED: ${{ steps.commit.outcome }}
          OUTCOME: ${{ steps.test.outcome }}
          # Through the environment like everything else in this file — never
          # interpolated into the script below, where a value containing $( )
          # or a backtick would execute.
          FLAG_ENABLED: ${{ steps.flag.outputs.enabled }}
          REASON: ${{ steps.summary.outputs.reason }}
          BASE_URL: ${{ inputs.base_url || 'https://comfy.org' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-site.yml
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "::warning::SLACK_BOT_TOKEN or SLACK_HUB_ALERTS_CHANNEL_ID is unset — skipping Slack notification."
            exit 0
          fi

          if [ "$DISABLE_OUTCOME" = "failure" ]; then
            TEXT=":rotating_light: *MiniMax H3 demo is broken and could not be switched off.* The integration test failed against ${BASE_URL} and the kill switch itself errored, so *the demo is still live*. Switch it off by hand: \`pnpm experiment-flag minimaxH3Demo off\` in \`site/\`, commit, deploy."
            TEXT="${TEXT}"$'\n'">${REASON}"
            TEXT="${TEXT}"$'\n'"<${RUN_URL}|View run>"
          elif [ "$DISABLED" = "true" ]; then
            TEXT=":warning: *MiniMax H3 demo switched off automatically.* The integration test failed against ${BASE_URL}, so the \`minimaxH3Demo\` experiment flag is now off and the page will serve its static fallback."
            TEXT="${TEXT}"$'\n'">${REASON}"
            if [ "$COMMITTED" = "success" ]; then
              TEXT="${TEXT}"$'\n'"The flip is committed to \`main\`. It reaches users on the next site build — <${DEPLOY_URL}|run Deploy Template Site> to apply it now."
            else
              TEXT="${TEXT}"$'\n'":rotating_light: The flag could not be committed to \`main\`, so *the demo is still live*. Someone needs to switch it off by hand."
            fi
            TEXT="${TEXT}"$'\n'"<${RUN_URL}|View run>"
          elif [ "$OUTCOME" = "success" ]; then
            TEXT=":white_check_mark: *MiniMax H3 demo integration passes* against ${BASE_URL} (flag is currently \`${FLAG_ENABLED}\`). Turning it on is a deliberate call: set the flag and deploy when you want it in front of users. <${RUN_URL}|View run>"
          else
            # Reached on a hand-run dispatch that failed without flipping anything
            # — the flag was already off, or a preview origin was tested. The run
            # is green because the test is continue-on-error, so without this the
            # operator who dispatched it would be told nothing at all.
            TEXT=":x: *MiniMax H3 demo integration failed* against ${BASE_URL}. The flag was left as \`${FLAG_ENABLED}\` — no change was made, either because it is already off or because this was not a production run."
            TEXT="${TEXT}"$'\n'">${REASON}"
            TEXT="${TEXT}"$'\n'"<${RUN_URL}|View run>"
          fi

          BODY=$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg text "$TEXT" '{channel: $ch, text: $text}')
          # Slack answers HTTP 200 with {"ok":false,...} on auth and channel
          # errors, so -f alone would report a silent drop as success.
          RESPONSE=$(curl -sS -X POST \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$BODY" \
            https://slack.com/api/chat.postMessage)
          if ! jq -e '.ok == true' <<<"$RESPONSE" >/dev/null; then
            echo "Slack rejected the notification: $(jq -r '.error // "unparseable response"' <<<"$RESPONSE")"
            exit 1
          fi
