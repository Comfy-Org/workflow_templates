name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            templates/
            blueprints/
            bundles.json
            blueprints_bundles.json
            scripts/
            packages/
            nx.json
            package.json
            package-lock.json
            pyproject.toml
            tsconfig.base.json
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip build pytest ruff aiohttp twine

      # Committed-manifest SHA check is a release gate (same policy as
      # validate-manifests.yml). Template-only PRs may leave the committed
      # manifest stale until a version-bump PR / publish regenerates it.
      # We still sync below so the package build uses fresh on-disk assets;
      # that sync is job-local and is not committed by this workflow.
      - name: Detect whether committed-manifest SHA gate applies
        id: manifest_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -E '^\s*version\s*=' pyproject.toml | head -1 | cut -d'"' -f2)
          REQUIRE=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
            fi
            BASE_VERSION=$(git show "${BASE_SHA}:pyproject.toml" 2>/dev/null | grep -E '^\s*version\s*=' | head -1 | cut -d'"' -f2 || true)
            if [ -n "${BASE_VERSION:-}" ] && [ "$CURRENT" != "$BASE_VERSION" ]; then
              REQUIRE=true
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if git diff --name-only HEAD~1 HEAD | grep -Eq '^(pyproject\.toml|packages/.*/manifest\.json)$'; then
              REQUIRE=true
            fi
          fi
          echo "require_manifest=$REQUIRE" >> "$GITHUB_OUTPUT"
          echo "Committed-manifest gate: require_manifest=$REQUIRE (version=$CURRENT)"

      - name: Verify committed manifest is not stale
        if: steps.manifest_gate.outputs.require_manifest == 'true'
        run: |
          echo "🔍 Release gate: validating packages/core/.../manifest.json as committed (pre-sync)."
          if ! python scripts/validate/validate_manifests.py; then
            echo "::error file=packages/core/src/comfyui_workflow_templates_core/manifest.json::Manifest is out of sync with templates/. On a version-bump/release PR, run 'python scripts/sync/sync_bundles.py' and commit the regenerated manifest."
            exit 1
          fi

      - name: Skip committed-manifest SHA check on template-only changes
        if: steps.manifest_gate.outputs.require_manifest != 'true'
        run: |
          echo "⏭️ Skipping committed-manifest SHA check (not a version-bump/release change)."
          echo "   Job-local sync below still regenerates assets for the build."

      - name: Sync manifest and bundle assets
        run: |
          source .venv/bin/activate
          python scripts/sync/sync_bundles.py

      - name: Lint Python modules
        run: |
          source .venv/bin/activate
          ruff check scripts/sync/sync_bundles.py scripts/sync/sync_is_app.py scripts/lib/index_format.py packages/core packages/meta

      - name: Build packages
        run: |
          source .venv/bin/activate
          rm -rf dist
          mkdir dist
          for pkg in core json media_api media_video media_image media_other media_assets_01 media_assets_02 meta; do
            python -m build --outdir dist packages/$pkg
          done

      - name: Run Nx build (sanity)
        env:
          NX_ADD_PLUGINS: "false"
          NX_DAEMON: "false"
        run: |
          source .venv/bin/activate
          npm run build:all

      - name: Run tests
        env:
          PYTHONPATH: packages/meta/src:packages/core/src:packages/json/src:packages/media_api/src:packages/media_video/src:packages/media_image/src:packages/media_other/src:packages/media_assets_01/src:packages/media_assets_02/src
        run: |
          source .venv/bin/activate
          pytest packages/core/tests
