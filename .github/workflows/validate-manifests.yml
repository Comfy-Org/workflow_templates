name: Validate Manifests

# Manifest SHA validation is a **release gate**, not a contributor PR gate.
#
# Template-only PRs may leave packages/core/.../manifest.json stale until a
# version-bump / release PR regenerates it (version-check.yml) and publish.yml
# syncs again before PyPI upload. That stops fork/contributor PRs from failing
# solely because they did not commit a regenerated manifest.
#
# When the root pyproject.toml version is strictly greater than the PR base
# version (or this is a push that touched pyproject.toml / the committed
# manifests), this job still validates the **committed** manifest against
# templates/ and fails on drift — same intentional non-tautological check as
# #1091 (no sync before validate). A stale branch whose head version is LOWER
# than base is a template-only PR, so it does not trip the gate.
#
# On non-release PRs we only enforce bundles.json membership so new templates
# are assigned, without requiring a manifest rewrite.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'templates/**'
      - 'blueprints/**'
      - 'bundles.json'
      - 'blueprints_bundles.json'
      - 'pyproject.toml'
      - 'packages/*/src/*/manifest.json'
      - 'packages/*/src/*/*.json'
      - 'scripts/validate/validate_manifests.py'
      - 'scripts/validate/list_pip_excluded.py'
      - 'scripts/sync/sync_bundles.py'
      - 'scripts/sync/sync_blueprints.py'
      - '.github/workflows/validate-manifests.yml'
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'blueprints/**'
      - 'bundles.json'
      - 'blueprints_bundles.json'
      - 'pyproject.toml'
      - 'packages/*/src/*/manifest.json'
      - 'packages/*/src/*/*.json'
      - 'scripts/validate/validate_manifests.py'
      - 'scripts/validate/list_pip_excluded.py'
      - '.github/workflows/validate-manifests.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # templates/ must be checked out in full, not just templates/*.json.
      # validate_manifests.py hashes every asset the manifest references, and a
      # missing .webp is indistinguishable from a deleted one — with a partial
      # checkout the job would fail on files that are simply not there.
      # The mirrored media under packages/media_*/ is not needed here (nothing
      # in this job reads it), so only the two committed manifests are fetched.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            templates/
            blueprints/
            bundles.json
            blueprints_bundles.json
            scripts/
            pyproject.toml
            packages/core/src/comfyui_workflow_templates_core/manifest.json
            packages/core/src/comfyui_workflow_templates_core/blueprints_manifest.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Detect whether this is a release / version-bump gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -E '^\s*version\s*=' pyproject.toml | head -1 | cut -d'"' -f2)
          REQUIRE_MANIFEST=false
          REASON=""

          # Release gate = head version strictly GREATER than base version.
          # A stale branch (head LOWER than base) is a template-only PR, not a bump.
          is_bump() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -1)" = "$2" ]
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "${BASE_SHA:-}" ]; then
              echo "::warning::Missing PR base SHA; treating as release gate to stay safe."
              REQUIRE_MANIFEST=true
              REASON="missing PR base SHA"
            else
              if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
                echo "::warning::PR base commit ${BASE_SHA} is not available locally."
                REQUIRE_MANIFEST=true
                REASON="unreadable PR base SHA ${BASE_SHA}"
              else
                # `|| true`: a base pyproject without a version line must reach the
                # empty-version branch below, not abort the step under pipefail.
                BASE_VERSION=$(git show "${BASE_SHA}:pyproject.toml" | grep -E '^\s*version\s*=' | head -1 | cut -d'"' -f2 || true)
                if [ -z "${BASE_VERSION:-}" ]; then
                  echo "::warning::Could not read base version from ${BASE_SHA}; treating as release gate to stay safe."
                  REQUIRE_MANIFEST=true
                  REASON="unreadable base version at ${BASE_SHA}"
                elif is_bump "$CURRENT" "$BASE_VERSION"; then
                  REQUIRE_MANIFEST=true
                  REASON="root version bumped ${BASE_VERSION} → ${CURRENT}"
                elif [ "$CURRENT" = "$BASE_VERSION" ]; then
                  REASON="root version unchanged (${CURRENT}); template-only PR"
                else
                  REASON="root version ${CURRENT} (behind base ${BASE_VERSION}); template-only PR"
                fi
              fi
            fi
          else
            # push to main: only enforce when this push changed version or manifests.
            # Use github.event.before so multi-commit pushes are covered fully.
            RANGE_BASE="HEAD~1"
            if [[ "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] && [ -n "${BEFORE_SHA//0/}" ] \
              && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              RANGE_BASE="$BEFORE_SHA"
            fi
            echo "Push diff range: ${RANGE_BASE}..HEAD"
            if git diff --name-only "$RANGE_BASE" HEAD | grep -Eq '^(pyproject\.toml|packages/.*/manifest\.json|packages/.*/blueprints_manifest\.json)$'; then
              REQUIRE_MANIFEST=true
              REASON="push touched version or committed manifest"
            else
              REASON="push did not touch version/manifest; defer SHA gate"
            fi
          fi

          echo "require_manifest=$REQUIRE_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Gate decision: require_manifest=$REQUIRE_MANIFEST ($REASON)"

      - name: Check bundles.json assignments
        run: |
          echo "🔍 Checking templates/ membership against bundles.json (not manifest)..."
          python3 scripts/sync/sync_bundles.py --check-only

      - name: Validate committed manifest against committed template files
        if: steps.gate.outputs.require_manifest == 'true'
        env:
          # PR-controlled (version strings from pyproject.toml) — never inline in run:.
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          echo "🔍 Release gate: validating packages/core/.../manifest.json as committed."
          echo "   Reason: ${REASON}"
          echo "   No sync is run first — stale sha256 entries must fail here."
          if ! python scripts/validate/validate_manifests.py; then
            echo "::error file=packages/core/src/comfyui_workflow_templates_core/manifest.json::Manifest is out of sync with templates/. On a version-bump/release PR, run 'python scripts/sync/sync_bundles.py' (or let version-check.yml auto-sync) and commit the regenerated manifest."
            exit 1
          fi

      - name: Skip committed-manifest SHA check on template-only PRs
        if: steps.gate.outputs.require_manifest != 'true'
        env:
          # PR-controlled (version strings from pyproject.toml) — never inline in run:.
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          echo "⏭️  Skipping committed-manifest SHA validation."
          echo "   Reason: ${REASON}"
          echo "   Manifest regeneration is deferred to version-bump / release / publish."
          echo "   bundles.json membership was still checked above."

      - name: Check for orphaned templates
        if: steps.gate.outputs.require_manifest == 'true'
        run: |
          echo "🔍 Checking for templates without manifest entries..."
          excluded=$(python3 scripts/validate/list_pip_excluded.py)
          cd templates
          orphaned=0
          for json_file in *.json; do
            template_name="${json_file%.json}"
            if echo "$excluded" | grep -qx "$template_name"; then
              continue
            fi
            if ! grep -q "\"$json_file\"" ../packages/core/src/comfyui_workflow_templates_core/manifest.json; then
              echo "⚠️  Orphaned template: $json_file"
              orphaned=$((orphaned + 1))
            fi
          done
          if [ $orphaned -gt 0 ]; then
            echo "❌ Found $orphaned orphaned template(s). Run sync_bundles.py to fix."
            exit 1
          else
            echo "✅ No orphaned templates found"
          fi

      - name: Check for orphaned blueprints
        if: steps.gate.outputs.require_manifest == 'true'
        run: |
          echo "🔍 Checking for blueprints without manifest entries..."
          cd blueprints
          orphaned=0
          for json_file in *.json; do
            # Skip index files
            if [[ "$json_file" == index* ]]; then
              continue
            fi
            if ! grep -q "\"$json_file\"" ../packages/core/src/comfyui_workflow_templates_core/blueprints_manifest.json; then
              echo "⚠️  Orphaned blueprint: $json_file"
              orphaned=$((orphaned + 1))
            fi
          done
          if [ $orphaned -gt 0 ]; then
            echo "❌ Found $orphaned orphaned blueprint(s). Run sync_blueprints.py to fix."
            exit 1
          else
            echo "✅ No orphaned blueprints found"
          fi
