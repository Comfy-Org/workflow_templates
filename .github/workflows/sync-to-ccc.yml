name: Sync templates to CCC (draft only)

# Creates/updates Comfy Content Catalog records for template files, as DRAFTS.
# Publishing stays manual: the catalog key is refused on /draft/publish by design.
#
# Required repository configuration
#   secret  CCC_API_KEY        same comfyui-… key used by the catalog API and by comfy-cli
#   var     CCC_API_BASE_URL   default https://cloud.comfy.org
#   var     CCC_PUBLIC_ORIGIN  default https://comfy.org
#   var     CCC_SYNC_ENABLED   'true' to allow draft writes; unset = dry run only
#
# WRITES ARE OFF until CCC_SYNC_ENABLED=true. With an incomplete identity ledger a write would
# overwrite live records' copy and graphs with a guessed pairing, so the default path is a read
# -only dry run that reports what it *would* write.
#
# Notes
#   * Every sync is serialised: `expected_draft_rev` is ONE global CAS token for the whole
#     shared draft, so two runs at the same time would 409 each other. Do not remove the
#     concurrency group.
#   * A template is keyed by `template_name` (the file stem). Records whose template_name is
#     null (older imports) are never touched, and a second record for the same stem is never
#     created.
#   * Examples are not produced here — an honest example is a real output of the graph, i.e. a
#     paid Cloud run. Existing examples on an update are preserved.

on:
  workflow_dispatch:
    inputs:
      templates:
        description: 'Space-separated template stems, or "all"'
        required: true
        default: 'all'
      write:
        description: 'Really write drafts (needs repo variable CCC_SYNC_ENABLED=true)'
        type: boolean
        default: false
      jobs:
        description: 'Parallel read/convert workers (catalog writes stay sequential)'
        default: '4'
      shard:
        description: 'Split a long run: "1/4", "2/4", ... Leave empty for a single run'
        default: ""
  push:
    branches: [main]
    paths:
      - 'templates/*.json'
      - '!templates/index*.json'
      - 'scripts/ccc/**'
      - '.github/workflows/sync-to-ccc.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'templates/*.json'
      - 'scripts/ccc/**'
      - '.github/workflows/sync-to-ccc.yml'

concurrency:
  group: ccc-catalog-draft
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    # forks never get the secret; they get the dry-run path below instead
    if: github.repository_owner == 'Comfy-Org'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # a write needs the kill switch AND explicit intent; pull requests never write
      CCC_SYNC_WRITE: ${{ github.event_name != 'pull_request' && vars.CCC_SYNC_ENABLED == 'true' && (github.event_name == 'push' || inputs.write == true) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            templates/
            scripts/ccc/
          sparse-checkout-cone-mode: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow
          pip install comfy-cli

      - name: Work out which templates to sync
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TEMPLATES: ${{ inputs.templates }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "write=$CCC_SYNC_WRITE" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT_TEMPLATES" = "all" ]; then
              echo "mode=all" >> "$GITHUB_OUTPUT"
              echo "stems=" >> "$GITHUB_OUTPUT"
            else
              stems=$(printf '%s\n' $INPUT_TEMPLATES | sed 's#^templates/##; s#\.json$##' | tr '\n' ' ')
              echo "mode=list" >> "$GITHUB_OUTPUT"
              echo "stems=$stems" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # push / pull_request: derive stems from the changed template files only
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}" || true
            range="origin/${{ github.base_ref }}...HEAD"
          else
            range="$BEFORE..$AFTER"
          fi
          changed=$(git diff --name-only "$range" -- 'templates/*.json' | grep -v 'templates/index' || true)
          stems=$(printf '%s\n' "$changed" | sed -n 's#^templates/\(.*\)\.json$#\1#p' | tr '\n' ' ')
          echo "changed=$changed"
          echo "mode=list" >> "$GITHUB_OUTPUT"
          echo "stems=$stems" >> "$GITHUB_OUTPUT"

      - name: Run sync (dry run unless writes are enabled)
        if: steps.targets.outputs.mode == 'all' || steps.targets.outputs.stems != ''
        env:
          CCC_API_KEY: ${{ secrets.CCC_API_KEY }}
          COMFY_CLOUD_API_KEY: ${{ secrets.CCC_API_KEY }}
          CCC_API_BASE_URL: ${{ vars.CCC_API_BASE_URL || 'https://cloud.comfy.org' }}
          CCC_PUBLIC_ORIGIN: ${{ vars.CCC_PUBLIC_ORIGIN || 'https://comfy.org' }}
          MODE: ${{ steps.targets.outputs.mode }}
          STEMS: ${{ steps.targets.outputs.stems }}
          WRITE: ${{ steps.targets.outputs.write }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOBS: ${{ inputs.jobs }}
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          args=()
          if [ "$MODE" = "all" ]; then
            args+=(--all)
          else
            # shellcheck disable=SC2206 - stems is a space separated list
            args+=(--stems $STEMS)
          fi
          args+=(--jobs "${JOBS:-4}")
          if [ -n "${SHARD:-}" ]; then
            args+=(--shard "$SHARD")
          fi
          # a graph-only edit leaves every field identical, and an unchanged document is
          # skipped; re-upload the media for the few templates a push/PR actually touched
          if [ "$MODE" = "list" ]; then
            args+=(--force-media)
          fi
          if [ "$WRITE" = "true" ]; then
            args+=(--change-id "ci-sync-$RUN_ID")
            echo "::notice::writing drafts, change id ci-sync-$RUN_ID"
          else
            args+=(--dry-run --change-id "ci-dryrun-${PR_NUMBER:-$RUN_ID}")
            echo "::notice::dry run, no catalog writes"
          fi
          python scripts/ccc/sync_to_ccc.py "${args[@]}"

      - name: Upload converted graphs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccc-sync-${{ github.run_id }}
          path: |
            .ccc-work/
          retention-days: 14

      - name: Comment on PR (dry run summary)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = process.env.GITHUB_STEP_SUMMARY;
            let body = 'CCC draft sync (dry run) produced no summary.';
            try { body = fs.readFileSync(p, 'utf8').split('## CCC draft sync').pop() || body; } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### CCC draft sync (dry run)\n' + body.slice(-6000)
            });
