name: Sync Custom Nodes Requirements

# This workflow verifies the requiresCustomNodes field in all index files
# when templates are changed in PRs.
#
# Process:
#   1. Scans all template JSON files (excluding index files) for cnr_id values
#   2. Extracts all non-comfy-core cnr_ids for each template
#   3. Updates requiresCustomNodes field in all index.[locale].json files
#   4. Commits changes back to PR branch if any updates were made
#
# This ensures that the requiresCustomNodes field is always up-to-date
# and synchronized across all language versions of the index files.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'templates/**.json'
      - 'scripts/sync/sync_custom_nodes.py'
      - 'scripts/lib/index_format.py'
      - '.github/workflows/sync-custom-nodes.yml'

permissions:
  contents: read

jobs:
  sync-custom-nodes:
    runs-on: ubuntu-latest
    # Only run on same-repo PRs (skip fork PRs as they can't auto-commit)
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Prevent concurrent runs on same PR (unique per fork+branch)
    concurrency:
      group: sync-custom-nodes-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.repo.full_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          sparse-checkout: |
            templates/*.json
            scripts/sync/sync_custom_nodes.py
            scripts/lib/index_format.py
            scripts/lib/paths.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync custom nodes requirements
        id: sync
        run: |
          echo "=== Syncing custom nodes requirements ==="
          python scripts/sync/sync_custom_nodes.py --templates-dir ./templates
          echo "✅ Custom nodes sync complete"

      - name: Check custom nodes requirements
        run: |
          if ! git diff --quiet -- templates/index*.json; then
            git diff --name-only -- templates/index*.json
            echo "::error::Custom nodes requirements are out of sync. Run: python scripts/sync/sync_custom_nodes.py --templates-dir ./templates"
            exit 1
          fi
          echo "✅ No custom nodes requirements changes needed"

