name: Site Setup
description: Checkout, set up Node.js and pnpm with caching, install dependencies for the site package

inputs:
  working-directory:
    description: Working directory for the site package
    default: site
  node-version:
    description: Node.js version override; defaults to the site's .nvmrc
    default: ''
  pnpm-version:
    description: pnpm version
    default: '9'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        # The Vercel adapter stamps this Node major into the deployed function
        # runtime, so CI and local builds share one pin.
        node-version-file: ${{ inputs.working-directory }}/.nvmrc
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
